name: CI Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      run: python -m pytest -q
      env:
        APP_ENV: test
        JWT_SECRET: "test-secret-for-ci-only"

    - name: Install Newman
      run: npm install -g newman

    - name: Run Postman tests against cloud server
      run: |
        newman run postman.json --env-var "baseUrl=https://metro-server-api.onrender.com/api/v1"